<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collective Attention – Taiwan Events</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }

    /* ── Layout ────────────────────────────────────────────────────── */
    header {
      background: linear-gradient(135deg, #1e3a5f 0%, #0d2137 100%);
      padding: 24px 32px;
      border-bottom: 1px solid #1e3a5f;
    }
    header h1 { font-size: 1.6rem; font-weight: 700; color: #60a5fa; }
    header p  { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 16px 32px;
      background: #131722;
      border-bottom: 1px solid #1e293b;
    }
    .tab-btn {
      padding: 8px 20px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s, color 0.2s;
    }
    .tab-btn.active {
      background: #1e40af;
      color: #fff;
      border-color: #1e40af;
    }
    .tab-btn:hover:not(.active) { background: #1e293b; color: #e2e8f0; }

    #controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 12px 32px;
      background: #131722;
    }
    #controls label { font-size: 0.85rem; color: #94a3b8; }
    #n-slider { accent-color: #3b82f6; }
    #n-label  { font-size: 0.85rem; color: #60a5fa; min-width: 28px; }
    #data-source {
      min-width: 220px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      padding: 8px 12px;
      font-size: 0.85rem;
    }
    .timeline-controls {
      display: none;
      align-items: center;
      gap: 12px;
      margin-left: auto;
      padding-left: 8px;
      border-left: 1px solid #334155;
    }
    #timeline-zoom { accent-color: #38bdf8; }
    #timeline-zoom-label {
      font-size: 0.8rem;
      color: #7dd3fc;
      min-width: 68px;
    }
    #timeline-year-filter {
      min-width: 132px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      padding: 8px 12px;
      font-size: 0.8rem;
    }
    .control-spacer {
      margin-left: auto;
    }

    main { padding: 24px 32px; max-width: 1100px; margin: 0 auto; }

    #status { color: #94a3b8; font-size: 0.9rem; margin-bottom: 16px; }

    /* ── Shared card ───────────────────────────────────────────────── */
    .event-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 12px;
      transition: border-color 0.2s;
      cursor: pointer;
    }
    .event-card:hover { border-color: #3b82f6; }
    .event-card .card-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    .event-card .rank {
      font-size: 1.2rem;
      font-weight: 800;
      color: #3b82f6;
      min-width: 36px;
    }
    .event-card .title {
      font-size: 1.05rem;
      font-weight: 600;
    }
    .event-card .date-badge {
      margin-left: auto;
      font-size: 0.78rem;
      color: #64748b;
      white-space: nowrap;
    }
    .event-card .bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }
    .score-bar-bg {
      flex: 1;
      height: 6px;
      background: #0f172a;
      border-radius: 3px;
      overflow: hidden;
    }
    .score-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.5s ease;
    }
    .score-label { font-size: 0.8rem; color: #60a5fa; min-width: 44px; text-align: right; }
    .explanation { font-size: 0.8rem; color: #94a3b8; margin-top: 6px; }
    .signals-row {
      display: none;
      gap: 16px;
      margin-top: 10px;
      font-size: 0.78rem;
      color: #64748b;
    }
    .event-card.expanded .signals-row { display: flex; flex-wrap: wrap; }
    .signal-pill {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 4px;
      padding: 2px 8px;
    }
    .keywords-row {
      display: none;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .event-card.expanded .keywords-row { display: flex; }
    .keyword-tag {
      background: #1e3a5f;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 0.72rem;
      color: #93c5fd;
    }
    /* Wikipedia source link in card header (always visible) */
    .wiki-header-link {
      font-size: 0.85rem;
      opacity: 0.6;
      transition: opacity 0.2s;
      text-decoration: none;
      flex-shrink: 0;
    }
    .wiki-header-link:hover { opacity: 1; }

    /* ── Timeline view ─────────────────────────────────────────────── */
    #timeline-view { display: none; }
    .timeline-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      padding: 12px 14px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0.84));
      color: #cbd5e1;
      font-size: 0.82rem;
    }
    .timeline-summary strong {
      color: #e2e8f0;
      font-weight: 600;
    }
    .timeline-overview {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 14px;
    }
    .timeline-density-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #cbd5e1;
      font-size: 0.8rem;
    }
    .timeline-density-chart {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(56px, 1fr));
      gap: 10px;
      align-items: end;
      min-height: 132px;
      padding: 14px 12px 10px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(23, 32, 51, 0.94), rgba(15, 23, 42, 0.94));
    }
    .timeline-density-bar {
      border: 1px solid #334155;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.7);
      color: #cbd5e1;
      padding: 8px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s;
    }
    .timeline-density-bar:hover {
      border-color: #38bdf8;
      transform: translateY(-1px);
    }
    .timeline-density-bar.active {
      border-color: #60a5fa;
      background: rgba(30, 64, 175, 0.22);
      box-shadow: inset 0 0 0 1px rgba(96, 165, 250, 0.2);
    }
    .timeline-density-year {
      display: block;
      color: #f8fafc;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }
    .timeline-density-count {
      display: block;
      font-size: 0.7rem;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .timeline-density-track {
      position: relative;
      height: 54px;
      border-radius: 8px;
      background: #0b1220;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .timeline-density-fill {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 8px 8px 0 0;
      background: linear-gradient(180deg, #38bdf8, #1d4ed8);
    }
    .timeline-density-score {
      display: block;
      font-size: 0.68rem;
      color: #7dd3fc;
    }
    .timeline-filter-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #334155;
      background: #0f172a;
    }
    .timeline-clear-btn {
      border: 1px solid #334155;
      border-radius: 999px;
      background: transparent;
      color: #cbd5e1;
      padding: 6px 10px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .timeline-clear-btn:hover {
      border-color: #60a5fa;
    }

    /* vis-timeline dark theme overrides */
    .vis-timeline { border-color: #334155 !important; background: #131722 !important; }
    .vis-time-axis .vis-text { color: #94a3b8 !important; }
    .vis-time-axis .vis-grid.vis-minor { border-color: #1e293b !important; }
    .vis-time-axis .vis-grid.vis-major { border-color: #334155 !important; }
    .vis-panel.vis-center,
    .vis-panel.vis-left,
    .vis-panel.vis-right { border-color: #334155 !important; }
    .vis-item {
      background: #1e3a5f;
      border-color: #3b82f6;
      color: #e2e8f0;
      border-radius: 6px;
      cursor: pointer;
    }
    .vis-item.vis-selected { background: #1e40af; border-color: #60a5fa; }
    .vis-item .vis-item-content { padding: 4px 8px; }
    .vis-item-title {
      font-size: 0.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
      display: block;
    }
    /* Detail card shown below the vis-timeline when an event is clicked */
    #tl-detail-panel { margin-top: 16px; }
    /* Undated events listed below the vis-timeline */
    #tl-undated-mount { margin-top: 24px; }
    .tl-undated-label { font-size: 0.85rem; color: #475569; margin-bottom: 12px; }

    /* Expand hint visible on ranking/detail cards */
    .expand-hint {
      font-size: 0.7rem;
      color: #475569;
      margin-top: 4px;
      user-select: none;
    }
    .event-card.expanded .expand-hint { display: none; }

    /* ── Score colour gradient (green → yellow → red inverse) ─────── */
    .score-high   { background: #22c55e; }
    .score-mid    { background: #facc15; }
    .score-low    { background: #3b82f6; }

    /* ── Empty / loading states ─────────────────────────────────────── */
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #334155;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 40px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ─────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      header, main, #controls, .tabs { padding-left: 16px; padding-right: 16px; }
      .event-card .card-header { flex-wrap: wrap; }
      .event-card .date-badge { margin-left: 0; }
      .timeline-controls {
        margin-left: 0;
        width: 100%;
        padding-left: 0;
        border-left: 0;
      }
      .control-spacer {
        margin-left: 0;
      }
      .timeline-summary {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
  <!-- vis-timeline: proper event timeline that avoids position:absolute stacking-context issues -->
  <link rel="stylesheet"
        href="https://unpkg.com/vis-timeline@7.7.3/styles/vis-timeline-graph2d.min.css"
        integrity="sha384-N/4l0y8PNlO5uZuzP9PK3bAgJQ8ZChybZFXB2mpkZRUil/bui++mvYXPzPAHpbr6"
        crossorigin="anonymous" />
  <script src="https://unpkg.com/vis-timeline@7.7.3/standalone/umd/vis-timeline-graph2d.min.js"
          integrity="sha384-MLX+7yEEPNEznaIWwQi2pBMODSBP6Qo6BOVpzjFWB0UkfEzEYsvHOo7ISLfcQeiI"
          crossorigin="anonymous"></script>
</head>
<body>

<header>
  <h1>🇹🇼 Collective Attention — Taiwan Events</h1>
  <p>Multi-signal collective-attention scores: Wikipedia · News · Google Trends</p>
</header>

<div class="tabs">
  <button class="tab-btn active" id="btn-ranking" onclick="switchView('ranking')">📊 By Attention</button>
  <button class="tab-btn"        id="btn-timeline" onclick="switchView('timeline')">🕐 Timeline</button>
</div>

<div id="controls">
  <label for="data-source">Dataset:</label>
  <select id="data-source" onchange="onDataSourceChange(this.value)">
    <option value="auto">Auto: live API, then bundled fallback</option>
    <option value="live">Live API</option>
    <option value="recent">Bundled recent 2014-2024</option>
    <option value="historical">Bundled historical 1986-2026</option>
  </select>
  <label for="n-slider">Top N events:</label>
  <input id="n-slider" type="range" min="3" max="20" value="10" oninput="onNChange(this.value)" />
  <span id="n-label">10</span>
  <div id="timeline-controls" class="timeline-controls">
    <label for="timeline-year-filter">Year:</label>
    <select id="timeline-year-filter" onchange="onTimelineYearFilterChange(this.value)">
      <option value="all">All years</option>
    </select>
    <label for="timeline-zoom">Timeline zoom:</label>
    <input id="timeline-zoom" type="range" min="12" max="96" value="40" oninput="onTimelineZoomChange(this.value)" />
    <span id="timeline-zoom-label">40 px/mo</span>
    <button class="tab-btn" onclick="fitTimeline()">Fit Range</button>
  </div>
  <button class="tab-btn control-spacer" onclick="loadData()">↻ Refresh</button>
</div>

<main>
  <div id="status">Loading…</div>
  <div id="ranking-view"></div>
  <div id="timeline-view"></div>
</main>

<script>
/* ────────────────────────────────────────────────────────────────────────
   State
   ──────────────────────────────────────────────────────────────────────── */
let allEvents   = [];          // full ranked list from the API
let currentView = 'ranking';  // 'ranking' | 'timeline'
let topN        = 10;
let _visTimeline = null;      // vis-timeline instance (created lazily, cached)
let _visItems    = null;      // vis-timeline DataSet (kept for incremental updates)
let _tlEvents    = [];        // events currently shown in the timeline (for click handler)
let timelineZoom = 40;
let currentSource = 'auto';
let currentSourceLabel = 'Auto';
let yearJumpOffsets = {};
let currentTimelineYear = 'all';

const DATA_SOURCE_OPTIONS = {
  auto: [
    { url: '/events/top?n=100&sort=attention', label: 'Live API' },
    { url: '/output/results.json', label: 'Bundled recent 2014-2024' },
    { url: '/output/results_1986_2026.json', label: 'Bundled historical 1986-2026' },
    { url: 'output/results.json', label: 'Bundled recent 2014-2024' },
    { url: 'output/results_1986_2026.json', label: 'Bundled historical 1986-2026' },
  ],
  live: [
    { url: '/events/top?n=100&sort=attention', label: 'Live API' },
  ],
  recent: [
    { url: '/output/results.json', label: 'Bundled recent 2014-2024' },
    { url: 'output/results.json', label: 'Bundled recent 2014-2024' },
  ],
  historical: [
    { url: '/output/results_1986_2026.json', label: 'Bundled historical 1986-2026' },
    { url: 'output/results_1986_2026.json', label: 'Bundled historical 1986-2026' },
  ],
};

/* ────────────────────────────────────────────────────────────────────────
   Data loading
   ──────────────────────────────────────────────────────────────────────── */
async function loadData() {
  setStatus('Loading…');
  showSpinner();

  const sources = DATA_SOURCE_OPTIONS[currentSource] || DATA_SOURCE_OPTIONS.auto;

  let data = null;
  let loadedLabel = currentSourceLabel;
  for (const src of sources) {
    try {
      const res = await fetch(src.url);
      if (!res.ok) continue;
      data = await res.json();
      if (data && (data.events || data.events === null)) {
        loadedLabel = src.label;
        break;
      }
    } catch (_) { /* try next */ }
  }

  if (!data || !Array.isArray(data.events)) {
    setStatus('⚠️  Could not load event data from the selected source.');
    document.getElementById('ranking-view').innerHTML = '';
    document.getElementById('timeline-view').innerHTML = '';
    return;
  }

  allEvents = data.events;
  currentSourceLabel = loadedLabel;
  syncTopNSlider();
  render();
}

/* ────────────────────────────────────────────────────────────────────────
   Rendering
   ──────────────────────────────────────────────────────────────────────── */
function render() {
  const events = allEvents.slice(0, topN);
  setStatus(`${currentSourceLabel} · showing ${events.length} of ${allEvents.length} events`);

  renderRanking(events);
  syncTimelineYearFilter(events);
  renderTimeline(events);
}

function syncTopNSlider() {
  const slider = document.getElementById('n-slider');
  const nextMax = Math.max(1, allEvents.length || 20);
  const nextMin = Math.min(3, nextMax);
  slider.max = String(nextMax);
  slider.min = String(nextMin);
  topN = Math.min(Math.max(topN, nextMin), nextMax);
  slider.value = String(topN);
  document.getElementById('n-label').textContent = String(topN);
}

function maxScore(events) {
  return Math.max(...events.map(e => e.score || 0), 1);
}

function scoreClass(score, max) {
  const pct = score / max;
  if (pct >= 0.75) return 'score-high';
  if (pct >= 0.45) return 'score-mid';
  return 'score-low';
}

function fmtDate(e) {
  if (!e.start_date) return '';
  if (!e.end_date || e.end_date === e.start_date) return e.start_date;
  return `${e.start_date} → ${e.end_date}`;
}

function buildCard(event, rank, maxScoreVal) {
  const scorePct    = Math.round((event.score / maxScoreVal) * 100);
  const colorClass  = scoreClass(event.score, maxScoreVal);
  const dateStr     = fmtDate(event);
  const sb          = event.score_breakdown || {};
  const sig         = event.signals || {};
  const keywords    = (event.keywords || []).map(k =>
    `<span class="keyword-tag">${escHtml(k)}</span>`).join('');
  // Wikipedia source link — always visible in the card header
  const wikiLink    = event.canonical_wiki_title
    ? `<a href="https://zh.wikipedia.org/wiki/${encodeURIComponent(event.canonical_wiki_title)}"
          target="_blank" rel="noopener"
          title="Wikipedia: ${escHtml(event.canonical_wiki_title)}"
          onclick="event.stopPropagation()"
          class="wiki-header-link">📖</a>`
    : '';

  return `
  <div class="event-card" id="card-${event.id}" onclick="toggleCard('${event.id}')">
    <div class="card-header">
      ${rank != null ? `<span class="rank">#${rank}</span>` : ''}
      <span class="title">${escHtml(event.title)}</span>
      ${wikiLink}
      ${dateStr ? `<span class="date-badge">📅 ${dateStr}</span>` : ''}
    </div>
    <div class="bar-row">
      <div class="score-bar-bg">
        <div class="score-bar-fill ${colorClass}" style="width:${scorePct}%"></div>
      </div>
      <span class="score-label">${(event.score || 0).toFixed(1)}</span>
    </div>
    ${sb.explanation ? `<div class="explanation">${escHtml(sb.explanation)}</div>` : ''}
    <div class="signals-row">
      ${sig.wiki_views != null ? `<span class="signal-pill">📖 Wiki: ${fmtNum(sig.wiki_views)}</span>` : ''}
      ${sig.news_count != null ? `<span class="signal-pill">📰 News: ${sig.news_count}</span>` : ''}
      ${sig.search_score != null ? `<span class="signal-pill">🔍 Trends: ${sig.search_score.toFixed(1)}</span>` : ''}
      ${sb.wiki_component != null ? `<span class="signal-pill">wiki_score: ${sb.wiki_component.toFixed(2)}</span>` : ''}
      ${sb.news_component != null ? `<span class="signal-pill">news_score: ${sb.news_component.toFixed(2)}</span>` : ''}
    </div>
    <div class="keywords-row">${keywords}</div>
    <div class="expand-hint">▸ Click to expand details</div>
  </div>`;
}

function renderRanking(events) {
  const mx  = maxScore(events);
  const html = events.map((e, i) => buildCard(e, i + 1, mx)).join('');
  document.getElementById('ranking-view').innerHTML = html;
}

function renderTimeline(events) {
  yearJumpOffsets = {};

  // Sort chronologically; undated events go last
  const sorted = [...events].sort((a, b) => {
    if (!a.start_date && !b.start_date) return 0;
    if (!a.start_date) return 1;
    if (!b.start_date) return -1;
    return a.start_date.localeCompare(b.start_date);
  });

  const mx = maxScore(events);
  const PX_PER_MONTH = timelineZoom;

  const datedEvents = sorted.filter(e => e.start_date);
  const filterYear = currentTimelineYear;
  const filteredDatedEvents = filterYear === 'all'
    ? datedEvents
    : datedEvents.filter(e => e.start_date.slice(0, 4) === filterYear);
  const undatedEvents = filterYear === 'all'
    ? sorted.filter(e => !e.start_date)
    : [];
  const shownEvents = [...filteredDatedEvents, ...undatedEvents];
  const tlContainer = document.getElementById('timeline-view');
  const overview = buildTimelineOverview(datedEvents);

  if (_visTimeline) {
    _visTimeline.destroy();
    _visTimeline = null;
    _visItems = null;
  }
  _tlEvents = shownEvents;

  // Fallback when no event has a date
  if (!filteredDatedEvents.length && !undatedEvents.length) {
    tlContainer.innerHTML = `
      ${overview}
      <div class="timeline-summary">
        <span><strong>Range</strong> no dated events in this filter</span>
        <span><strong>Events</strong> 0 shown</span>
      </div>`;
    return;
  }

  const sortedDates = filteredDatedEvents.map(e => e.start_date).sort();
  const firstDate = sortedDates.length ? new Date(sortedDates[0]) : new Date(2013, 0, 1);
  const lastDate = sortedDates.length ? new Date(sortedDates[sortedDates.length - 1]) : new Date(2025, 11, 31);
  const paddingMonths = Math.max(1, Math.round(120 / Math.max(12, timelineZoom)));
  const windowStart = new Date(firstDate.getFullYear(), firstDate.getMonth() - paddingMonths, 1);
  const windowEnd = new Date(lastDate.getFullYear(), lastDate.getMonth() + paddingMonths + 1, 0);
  const rangeLabel = `${windowStart.getFullYear()}/${windowStart.getMonth() + 1} → ${windowEnd.getFullYear()}/${windowEnd.getMonth() + 1}`;
  const datedLabel = `${filteredDatedEvents.length} dated · ${undatedEvents.length} undated`;

  tlContainer.innerHTML = `
    <div class="timeline-summary">
      <span><strong>Range</strong> ${rangeLabel}</span>
      <span><strong>Zoom</strong> level ${timelineZoom}</span>
      <span><strong>Events</strong> ${datedLabel}</span>
    </div>
    ${overview}
    <div id="vis-tl-mount" style="margin-bottom:16px"></div>
    <div id="tl-detail-panel"></div>
    <div id="tl-undated-mount"></div>`;

  const visItemsData = filteredDatedEvents.map(e => {
    yearJumpOffsets[e.start_date.slice(0, 4)] = {
      start: new Date(e.start_date),
      end: new Date((e.end_date && e.end_date !== e.start_date) ? e.end_date : e.start_date),
    };
    return {
      id: e.id,
      content: `<span class="vis-item-title">${escHtml(e.title)}</span>`,
      start: e.start_date,
      ...(e.end_date && e.end_date !== e.start_date ? { end: e.end_date } : {}),
    };
  });

  _visItems = new vis.DataSet(visItemsData);
  _visTimeline = new vis.Timeline(document.getElementById('vis-tl-mount'), _visItems, {
    height: `${Math.max(320, 260 + timelineZoom * 2)}px`,
    start: windowStart,
    end: windowEnd,
    orientation: { axis: 'top' },
    zoomKey: 'ctrlKey',
    showCurrentTime: false,
    selectable: true,
  });
  _visTimeline.on('click', function (props) {
    const curMx = maxScore(_tlEvents);
    if (props.item) {
      toggleTimelineDetail(props.item, _tlEvents, curMx);
    } else {
      document.getElementById('tl-detail-panel').innerHTML = '';
      _visTimeline.setSelection([]);
    }
  });

  const undatedMount = document.getElementById('tl-undated-mount');
  if (undatedEvents.length) {
    undatedMount.innerHTML =
      '<p class="tl-undated-label">— undated events —</p>' +
      undatedEvents.map(e => buildCard(e, null, mx)).join('');
  } else {
    undatedMount.innerHTML = '';
  }
}

function toggleTimelineDetail(eventId, events, mx) {
  const panel = document.getElementById('tl-detail-panel');
  if (panel.querySelector(`[id="${CSS.escape('card-' + eventId)}"]`)) {
    panel.innerHTML = '';
    if (_visTimeline) _visTimeline.setSelection([]);
    return;
  }
  const event = events.find(e => e.id === eventId);
  if (!event) return;
  if (_visTimeline) _visTimeline.setSelection([eventId]);
  panel.innerHTML = buildCard(event, null, mx);
  const card = panel.querySelector(`[id="${CSS.escape('card-' + eventId)}"]`);
  if (card) card.classList.add('expanded');
  if (typeof panel.scrollIntoView === 'function') {
    panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function buildTimelineOverview(events) {
  if (!events.length) return '';

  const yearStats = new Map();
  for (const event of events) {
    const year = event.start_date.slice(0, 4);
    const existing = yearStats.get(year) || { count: 0, score: 0 };
    existing.count += 1;
    existing.score += event.score || 0;
    yearStats.set(year, existing);
  }

  const orderedStats = Array.from(yearStats.entries()).sort((a, b) => a[0].localeCompare(b[0]));
  const maxCount = Math.max(...orderedStats.map(([, stat]) => stat.count), 1);
  const activeLabel = currentTimelineYear === 'all' ? 'All years' : currentTimelineYear;

  return `<div class="timeline-overview">
    <div class="timeline-density-header">
      <span class="timeline-filter-badge">Year filter: <strong>${activeLabel}</strong></span>
      ${currentTimelineYear === 'all'
        ? ''
        : '<button class="timeline-clear-btn" onclick="clearTimelineYearFilter()">Show all years</button>'}
    </div>
    <div class="timeline-density-chart">${orderedStats
    .map(([year, stat]) => `
      <button class="timeline-density-bar ${currentTimelineYear === year ? 'active' : ''}" onclick="focusTimelineYear('${year}')">
        <span class="timeline-density-year">${year}</span>
        <span class="timeline-density-count">${stat.count} event${stat.count === 1 ? '' : 's'}</span>
        <span class="timeline-density-track">
          <span class="timeline-density-fill" style="height:${Math.max(10, Math.round((stat.count / maxCount) * 100))}%"></span>
        </span>
        <span class="timeline-density-score">attention ${stat.score.toFixed(1)}</span>
      </button>`)
    .join('')}</div>
  </div>`;
}

function jumpToTimelineYear(year) {
  const range = yearJumpOffsets[year];
  if (!range || !_visTimeline) return;

  const start = new Date(range.start.getFullYear(), 0, 1);
  const end = new Date(range.end.getFullYear(), 11, 31);
  _visTimeline.setWindow(start, end, { animation: true });
}

function focusTimelineYear(year) {
  if (currentTimelineYear === year) {
    clearTimelineYearFilter();
    return;
  }
  currentTimelineYear = year;
  syncTimelineYearSelect();
  render();
  jumpToTimelineYear(year);
}

function clearTimelineYearFilter() {
  currentTimelineYear = 'all';
  syncTimelineYearSelect();
  render();
}

/* ────────────────────────────────────────────────────────────────────────
   UI interactions
   ──────────────────────────────────────────────────────────────────────── */
function switchView(view) {
  currentView = view;
  document.getElementById('ranking-view').style.display  = (view === 'ranking')  ? 'block' : 'none';
  document.getElementById('timeline-view').style.display = (view === 'timeline') ? 'block' : 'none';
  document.getElementById('timeline-controls').style.display = (view === 'timeline') ? 'flex' : 'none';
  document.querySelector('.control-spacer').style.marginLeft = (view === 'timeline') ? '0' : 'auto';
  document.getElementById('btn-ranking').classList.toggle('active',  view === 'ranking');
  document.getElementById('btn-timeline').classList.toggle('active', view === 'timeline');
  // vis-timeline needs an explicit redraw after its container transitions from
  // display:none to display:block — otherwise item positions are miscalculated.
  if (view === 'timeline' && _visTimeline) _visTimeline.redraw();
}

function toggleCard(id) {
  const el = document.getElementById(`card-${id}`);
  if (el) el.classList.toggle('expanded');
}

function onNChange(val) {
  topN = parseInt(val, 10);
  document.getElementById('n-label').textContent = val;
  render();
}

function onDataSourceChange(val) {
  currentSource = val;
  currentSourceLabel = document.getElementById('data-source').selectedOptions[0].textContent;
  currentTimelineYear = 'all';
  loadData();
}

function onTimelineYearFilterChange(val) {
  currentTimelineYear = val;
  render();
}

function onTimelineZoomChange(val) {
  timelineZoom = parseInt(val, 10);
  setTimelineZoomLabel();
  render();
}

function fitTimeline() {
  const events = allEvents
    .slice(0, topN)
    .filter(e => e.start_date)
    .filter(e => currentTimelineYear === 'all' || e.start_date.slice(0, 4) === currentTimelineYear)
    .sort((a, b) => a.start_date.localeCompare(b.start_date));
  if (!events.length) return;

  const first = events[0].start_date;
  const last = events[events.length - 1].start_date;
  const totalMonths = Math.max(1,
    (parseInt(last.slice(0, 4), 10) - parseInt(first.slice(0, 4), 10)) * 12 +
    (parseInt(last.slice(5, 7), 10) - parseInt(first.slice(5, 7), 10)) + 2
  );
  timelineZoom = Math.max(12, Math.min(96, Math.round(1800 / totalMonths)));
  document.getElementById('timeline-zoom').value = String(timelineZoom);
  setTimelineZoomLabel();
  render();
}

/* ────────────────────────────────────────────────────────────────────────
   Helpers
   ──────────────────────────────────────────────────────────────────────── */
function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

function showSpinner() {
  document.getElementById('ranking-view').innerHTML  = '<div class="spinner"></div>';
  document.getElementById('timeline-view').innerHTML = '';
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function fmtNum(n) {
  return Number(n).toLocaleString();
}

function syncTimelineYearFilter(events) {
  const select = document.getElementById('timeline-year-filter');
  const years = Array.from(new Set(events
    .filter(e => e.start_date)
    .map(e => e.start_date.slice(0, 4)))).sort();

  const options = ['<option value="all">All years</option>']
    .concat(years.map(year => `<option value="${year}">${year}</option>`));
  select.innerHTML = options.join('');

  if (currentTimelineYear !== 'all' && !years.includes(currentTimelineYear)) {
    currentTimelineYear = 'all';
  }
  syncTimelineYearSelect();
}

function syncTimelineYearSelect() {
  document.getElementById('timeline-year-filter').value = currentTimelineYear;
}

function setTimelineZoomLabel() {
  document.getElementById('timeline-zoom-label').textContent = `zoom ${timelineZoom}`;
}

/* ────────────────────────────────────────────────────────────────────────
   Boot
   ──────────────────────────────────────────────────────────────────────── */
switchView('ranking');
setTimelineZoomLabel();
document.getElementById('data-source').value = currentSource;
loadData();
</script>
</body>
</html>
