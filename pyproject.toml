[project]
name = "collective-attention"
version = "0.1.0"
description = "Quantifies collective attention of real-world events using multi-source signals (Wikipedia, news, search)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    # Web / API
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "requests>=2.31.0",
    # Data processing
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    # NLP / Embeddings (event detection clustering)
    "sentence-transformers>=2.7.0",
    # Clustering
    "hdbscan>=0.8.33",
    # RSS feed parsing
    "feedparser>=6.0.11",
    # Google Trends
    "pytrends>=4.9.2",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "requests-mock>=1.11.0",
    "httpx>=0.27.0",
    # Code quality
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-requests>=2.31.0",
]

[project.scripts]
run-pipeline = "run_pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "api", "core"]

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
